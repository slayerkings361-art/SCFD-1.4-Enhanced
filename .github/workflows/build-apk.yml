name: Build SCFD 1.4 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          unzip -o SCFD-1.4-Enhanced-Demo-Android-Build.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          ls /usr/local/lib/android/sdk/platforms
          test -d /usr/local/lib/android/sdk/platforms/android-35

      - name: Build APK
        working-directory: source
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          cp source/app/build/outputs/apk/debug/app-debug.apk SCFD-1.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCFD-1.4-APK
          path: SCFD-1.4.apk
